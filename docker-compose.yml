services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: student_campus_portal
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run env:init first}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_user -d student_campus_portal"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - portal_postgres:/var/lib/postgresql/data

volumes:
  portal_postgres:
